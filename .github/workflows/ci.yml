# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      # winit and iced load X11 and Wayland at run time but still need the
      # development headers to build. mesa-vulkan-drivers brings lavapipe, the
      # software Vulkan device the offscreen render test runs on: without it
      # that test skips itself and stops guarding anything.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      # The stylus tests build a synthetic tablet with uinput. Best effort:
      # if the runner will not allow it the test prints a skip and passes, which
      # is why the local run is the one that counts for pen work.
      - name: Try to make uinput usable
        continue-on-error: true
        run: |
          sudo modprobe uinput || true
          sudo chmod 666 /dev/uinput || true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The offscreen test is the end to end run: it renders the sculpt to a
      # texture and checks the pixels. It skips when no adapter is present, so
      # confirm one was actually found rather than trusting a green tick.
      #
      # Matched as a pattern and not as one exact string. This used to grep for
      # "skipping the offscreen render test", and `offscreen.rs` already prints
      # "skipping the pattern render test" and "skipping the overlay render
      # test" -- neither of which this guard covered, so either could skip
      # itself on a runner with no adapter and go green having rendered
      # nothing. Every new offscreen test naturally invents a fourth string,
      # and the guard has to cover it without anyone remembering to widen this.
      - name: Confirm the offscreen render tests really ran
        run: |
          output=$(cargo test -p brokkr-gpu --test offscreen -- --nocapture 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "skipping the .* test"; then
            echo "No Vulkan adapter was available, so the end to end tests did not run."
            exit 1
          fi

      # brokkr-core must stay free of UI, windowing and GPU dependencies. That
      # is what keeps the shell choice reversible: swapping Iced for something
      # else has to touch brokkr-app only. Checked rather than trusted, because
      # a stray `use` in a hurry is exactly how this rots.
      - name: Engine has no UI dependencies
        run: |
          tree=$(cargo tree -p brokkr-core -e normal --prefix none --no-dedupe)
          if echo "$tree" | grep -qiE '^(iced|winit|wgpu|egui|tauri|raw-window-handle)\b'; then
            echo "brokkr-core picked up a UI or GPU dependency:"
            echo "$tree" | grep -iE '^(iced|winit|wgpu|egui|tauri|raw-window-handle)\b'
            exit 1
          fi
          echo "brokkr-core is clean"

  # **A survey, not a gate.** The open beta ships on three platforms and this
  # workspace has only ever been compiled on one, so the `cfg(not(linux))`
  # fallbacks in `tablet.rs` and `spacemouse.rs` have never been built by
  # anything. This job exists to find out what breaks; a red row here is the
  # information, not a regression. Nothing depends on it and it must not be
  # made a required check until it is actually green.
  #
  # Windows GATES and macOS does not, and that asymmetry is the current state
  # of the port rather than a preference.
  #
  # Windows builds and passes the whole suite, so it is held to the same bar as
  # Linux: warnings are errors there again, because this platform is now being
  # kept rather than measured.
  #
  # macOS builds and passes 16 of 20 offscreen render tests. The four that fail
  # are a Metal/Vulkan divergence in what reaches the screen -- a uniformly
  # masked body showing a 58 level tint jump at a brick seam, which the seam
  # test itself predicts is "a vertex that fell back to the unmasked byte".
  # Nobody has yet run this on a Mac to see it, and a pixel divergence cannot be
  # diagnosed through a CI log. Informational until someone can watch it, which
  # is honest about the state; deleting the job or leaving main red are the two
  # worse options. **macOS must gate before it ships to anyone.**
  cross:
    name: Build and test (${{ matrix.os }})
    strategy:
      # Both platforms every run: one failing must not cancel the other, or
      # half the answer is missing.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            informational: false
          - os: macos-latest
            informational: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.informational }}
    env:
      # Cleared only where the platform is still a survey. On Windows the
      # workflow-level `-D warnings` applies again.
      RUSTFLAGS: ${{ matrix.informational && '' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      # Separate from the test step so the report can say which of the two
      # failed. A workspace that does not build and one that builds but fails
      # its tests are different amounts of work.
      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  budget:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # NOT a gate here, and the numbers say why. This used to run as one, on
      # the reasoning that local margins were large enough for a shared runner
      # to pass comfortably. Measured on 2026-08-20, that was wrong by an order
      # of magnitude: brush edit p95 came out at 82.3 ms against an 8 ms budget
      # and dirty remesh at 71.7 ms against 8 ms, while the same commit on the
      # development machine passes every row.
      #
      # The budgets are a frame-time constraint -- 4 ms to edit, 8 ms to remesh,
      # 16 ms for both, because a stroke has to fit inside a frame. Raising them
      # to whatever a two core shared runner can manage would delete the only
      # thing they mean. So the budgets stay honest and this job stops
      # pretending it can judge them: it runs, it prints, and a red row here is
      # a trend to look at rather than a broken build.
      #
      # **The gate is the local run**, with the application closed, which is how
      # every figure in `handoff.md` was measured.
      - name: Sculpt budget (informational, shared runners are far slower)
        continue-on-error: true
        run: cargo bench -p brokkr-core
