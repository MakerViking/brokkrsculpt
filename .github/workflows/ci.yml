# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      # winit and iced load X11 and Wayland at run time but still need the
      # development headers to build. mesa-vulkan-drivers brings lavapipe, the
      # software Vulkan device the offscreen render test runs on: without it
      # that test skips itself and stops guarding anything.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      # The stylus tests build a synthetic tablet with uinput. Best effort:
      # if the runner will not allow it the test prints a skip and passes, which
      # is why the local run is the one that counts for pen work.
      - name: Try to make uinput usable
        continue-on-error: true
        run: |
          sudo modprobe uinput || true
          sudo chmod 666 /dev/uinput || true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The offscreen test is the end to end run: it renders the sculpt to a
      # texture and checks the pixels. It skips when no adapter is present, so
      # confirm one was actually found rather than trusting a green tick.
      - name: Confirm the offscreen render test really ran
        run: |
          output=$(cargo test -p brokkr-gpu --test offscreen -- --nocapture 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipping the offscreen render test"; then
            echo "No Vulkan adapter was available, so the end to end test did not run."
            exit 1
          fi

      # brokkr-core must stay free of UI, windowing and GPU dependencies. That
      # is what keeps the shell choice reversible: swapping Iced for something
      # else has to touch brokkr-app only. Checked rather than trusted, because
      # a stray `use` in a hurry is exactly how this rots.
      - name: Engine has no UI dependencies
        run: |
          tree=$(cargo tree -p brokkr-core -e normal --prefix none --no-dedupe)
          if echo "$tree" | grep -qiE '^(iced|winit|wgpu|egui|tauri|raw-window-handle)\b'; then
            echo "brokkr-core picked up a UI or GPU dependency:"
            echo "$tree" | grep -iE '^(iced|winit|wgpu|egui|tauri|raw-window-handle)\b'
            exit 1
          fi
          echo "brokkr-core is clean"

  budget:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The budgets are treated as tests, not aspirations. Local margins are
      # large (brush edit p95 is roughly 60 times under budget, remesh roughly
      # 8 times), so a slower shared runner should still pass comfortably. If
      # this turns out to be noisy, raise the budgets in the harness with a
      # note rather than dropping the gate.
      - name: Sculpt budget
        run: cargo bench -p brokkr-core
