# SPDX-License-Identifier: AGPL-3.0-only
#
# Rolling `beta` prerelease, unsigned, on all three platforms.
#
# **Unsigned is a decision, not an omission.** Apple enrolment is $99/yr and
# Microsoft's is its own process, and neither is affordable yet; SindriCAD ships
# the same way and has since its own beta. What that costs the user is one
# scary dialog per platform, so the release notes below tell them exactly what
# it says and exactly what to do about it. Signing goes in here later and
# nothing else about this file changes.
#
# Everything is built from source on the platform it targets. There is no cross
# compilation: `ring` will not build its C for darwin from a Linux host and the
# Windows target wants `lib.exe`, so the matrix IS the toolchain.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# **Two pushes to `main` in quick succession would otherwise race.** Both jobs
# upload fixed-name assets with `--clobber`, so without this the reachable
# states include a new binary beside an old manifest, and a sweep from one run
# deleting the payloads the other's manifest names. `cancel-in-progress: false`
# rather than true: a half-finished publish is worse than a queued one, and the
# expensive part is the build, not the wait.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # **The build ordinal, and the only thing in this file that orders releases.**
  # `CARGO_PKG_VERSION` is frozen at 0.0.1 and a git SHA has no order, so this
  # is what the updater compares. `BASE` is the literal 1000, chosen on
  # 2026-08-30 against a `run_number` of 4, so the first stamped build is 1005.
  #
  # **`github.run_number` restarts at 1 if this workflow file is renamed or
  # recreated.** If that ever happens, bump the literal to the next multiple of
  # 1000 above the highest ordinal ever published, or new builds sort below old
  # ones for ever and every installed copy refuses them.
  #
  # Four digits also makes a stale ordinal visible by eye: a number that could
  # be mistaken for a run number or a version is one nobody double-takes at.
  #
  # **The sum is done in a step, not here.** `BROKKR_BUILD: ${{ 1000 +
  # github.run_number }}` looks obvious and does not compile: ARITHMETIC in a
  # workflow-level `env` value fails the whole workflow before any job is
  # created, so nothing runs and the run is reported against the file path
  # rather than the `name:`. Measured 2026-08-30 by bisecting it on a scratch
  # branch -- `${{ github.run_number }}` alone is fine there and `${{ 1000 + 14
  # }}` alone is not, so it is the operator and not the context. A broken
  # workflow also reports a failed run on every push to EVERY branch, which is
  # what makes it look like something else.
  BROKKR_BUILD_BASE: "1000"

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      # One platform failing must not cancel the others: a two-platform release
      # is worth publishing while the third is fixed.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # **Capitalised, and deliberately NOT starting with `brokkrsculpt`.**
            # GitHub lists release assets alphabetically, so while these were
            # named `brokkrsculpt-linux-x86_64.tar.gz` they sorted BELOW every
            # `brokkrsculpt-<ordinal>-…` payload -- 33 near-identical names in
            # front of the three a person actually wants. No name beginning
            # `brokkrsculpt` can win that sort, because the comparison reaches
            # `1` against `l`/`w`/`m` and the digit sorts first. Hence a
            # different first letter for the human downloads and `update-` for
            # the payloads: `B` < `l` < `u` under both a case-sensitive and a
            # case-insensitive sort, so the ordering holds either way.
            #
            # This is not cosmetic. A Windows tester on 2026-08-31 downloaded a
            # bare payload `.exe` instead of this archive and ran it out of his
            # Downloads folder, which is why his install directory was somewhere
            # the updater had to reason about at all.
            asset: BrokkrSculpt-Linux-x86_64.tar.gz
            # The raw, build-stamped executable the updater downloads. Named
            # separately from `asset` because the two have different jobs: this
            # one is named by the signed manifest and must never be replaced in
            # place, while `asset` is the fixed-name human download and is
            # clobbered on every push.
            slug: linux-x86_64
          - os: windows-latest
            asset: BrokkrSculpt-Windows-x86_64.zip
            slug: windows-x86_64
          - os: macos-latest
            asset: BrokkrSculpt-macOS-arm64.zip
            slug: macos-arm64
    runs-on: ${{ matrix.os }}
    # **This job compiles the entire dependency tree, with build scripts and
    # proc macros.** It has no business holding a token that can write to the
    # repository, and until now it inherited the repository default because it
    # declared nothing. The `publish` job below is where write access belongs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # `actions/checkout` otherwise leaves a credential in
          # `.git/config` for the rest of the job, reachable by anything the
          # build runs. Nothing here needs to talk to git after the clone.
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2

      # The same set the CI job installs. Without them winit and iced fail to
      # link rather than failing to run, so this is a build dependency and not a
      # runtime one.
      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Compute the build ordinal
        shell: bash
        run: echo "BROKKR_BUILD=$((BROKKR_BUILD_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p brokkr-app

      # **Read the ordinal back out of the binary that was just built.**
      #
      # This step exists because of one specific, silent failure. `build.rs`
      # returns early when `BROKKR_COMMIT` is set -- which this workflow sets --
      # so a `BROKKR_BUILD` emission placed after that guard never runs; and
      # `Swatinem/rust-cache` will happily serve a warm build-script output, so
      # a binary can be published reporting the PREVIOUS run's ordinal with
      # nothing anywhere saying so. That failure is self-perpetuating: every
      # later release inherits it. Compiling successfully proves nothing here.
      # Only asking the artefact what it thinks it is does.
      #
      # `-x` so `1005` cannot match inside `10050`. `:?` so an unset variable
      # fails the step rather than comparing the empty string against itself --
      # a check that quietly compares nothing to nothing reproduces exactly the
      # bug it is guarding. `shell: bash` because the Windows job's other steps
      # are `pwsh`. Nothing is cross compiled, so every runner can execute what
      # it just built.
      - name: Verify the stamped ordinal
        shell: bash
        run: |
          set -euo pipefail
          exe=target/release/brokkrsculpt
          [ "${{ matrix.os }}" = "windows-latest" ] && exe=target/release/brokkrsculpt.exe
          "$exe" --version
          "$exe" --version | grep -qx "build = ${BROKKR_BUILD:?}"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          mkdir -p stage/brokkrsculpt
          cp target/release/brokkrsculpt stage/brokkrsculpt/
          cp packaging/brokkrsculpt.desktop stage/brokkrsculpt/
          cp README.md LICENSE stage/brokkrsculpt/
          tar -C stage -czf "${{ matrix.asset }}" brokkrsculpt

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/brokkrsculpt | Out-Null
          Copy-Item target/release/brokkrsculpt.exe stage/brokkrsculpt/
          Copy-Item README.md, LICENSE stage/brokkrsculpt/
          Compress-Archive -Path stage/brokkrsculpt -DestinationPath "${{ matrix.asset }}"

      # A real `.app`, because a bare Mach-O binary is not something a Mac user
      # can double click. Hand-built rather than bundled by a tool: the whole
      # bundle is a directory, an `Info.plist` and the executable, and adding a
      # packaging dependency to write nine lines of XML is the wrong trade.
      #
      # `ditto` and not `zip`, because zip flattens the bundle's structure and
      # the result does not open.
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          APP="stage/BrokkrSculpt.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/brokkrsculpt "$APP/Contents/MacOS/BrokkrSculpt"
          chmod +x "$APP/Contents/MacOS/BrokkrSculpt"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BrokkrSculpt</string>
            <key>CFBundleDisplayName</key><string>BrokkrSculpt</string>
            <key>CFBundleIdentifier</key><string>com.tinkeratlas.brokkrsculpt</string>
            <key>CFBundleExecutable</key><string>BrokkrSculpt</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          cp README.md LICENSE stage/
          ditto -c -k --keepParent "$APP" "${{ matrix.asset }}"

      # The updater's payload: the raw executable, build-stamped, beside the
      # human-facing archive. Raw rather than an archive so the signed SHA-256
      # is the digest of the exact bytes that get made executable -- there is no
      # window between "verified the archive" and "installed whatever came out
      # of it", and no tar or zip parser has to be written for the one code path
      # whose output is executed.
      #
      # macOS is the exception and gets the bundle zip unchanged: that platform
      # is download-and-hand-over, so the client never opens it.
      - name: Stage the build-stamped payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          # **`update-`, so these sort below the human downloads.** The name is
          # carried in the signed manifest as DATA -- the client joins it to a
          # compiled-in URL prefix -- so renaming the scheme is safe for copies
          # already installed: a rollback manifest naming a pre-rename build
          # still resolves, because those payloads keep their old names and stay
          # in the release until the sweep ages them out. `sign-release.sh`
          # therefore looks for both spellings, and the sweep counts both.
          case "${{ matrix.slug }}" in
            linux-x86_64)   cp target/release/brokkrsculpt "payload/update-${BROKKR_BUILD:?}-linux-x86_64" ;;
            windows-x86_64) cp target/release/brokkrsculpt.exe "payload/update-${BROKKR_BUILD:?}-windows-x86_64.exe" ;;
            macos-arm64)    cp "${{ matrix.asset }}" "payload/update-${BROKKR_BUILD:?}-macos-arm64.zip" ;;
          esac
          ls -l payload

      # A plain tarball rather than an AppImage or a .deb. Both are worth having
      # and neither is worth blocking a beta on: a tarball runs on every distro,
      # needs no packaging toolchain in CI, and the `.desktop` file beside it is
      # what a user copies into ~/.local/share/applications if they want a menu
      # entry.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          # Both halves of what this platform produced: the fixed-name archive a
          # human downloads, and the build-stamped payload the updater does.
          # `payload/` keeps them apart so the publish job can treat them
          # differently -- the archive is clobbered every push, the payload is
          # written once and never replaced.
          path: |
            ${{ matrix.asset }}
            payload/
          if-no-files-found: error

  publish:
    name: Publish the rolling beta
    needs: build
    # `always()` so two good platforms still publish when the third fails to
    # build. `needs.build.result` is checked in the step instead, which is what
    # lets the notes say which ones are actually attached.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # **The signing key lives here, scoped to an environment.** An environment
    # keeps the secret out of every other job and workflow in the repository and
    # gives the release its own audit trail, which a bare repo secret does not.
    # Add a branch protection rule on it limiting deployments to `main`; this
    # workflow has no tag trigger, so there is nothing else to reach it.
    environment: release
    permissions:
      contents: write
      # For `actions/attest-build-provenance`. Free, and it is an independent
      # trust root that a locally-held signing key cannot provide: the minisign
      # key proves Thomas signed a manifest, while an attestation proves THIS
      # workflow, at THIS commit, produced these bytes. `sign-release.sh` checks
      # it before signing, which is what stops a compromised runner uploading a
      # backdoored payload that then gets faithfully signed.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Before the upload, so an artefact that cannot be attested is never
      # published in the first place.
      - name: Attest the payloads
        if: hashFiles('dist/payload/*') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/payload/*

      - name: Compute the build ordinal
        shell: bash
        run: echo "BROKKR_BUILD=$((BROKKR_BUILD_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The two sets are uploaded differently and must not be globbed
          # together. `-maxdepth 1` keeps the fixed-name human archives from
          # sweeping up the build-stamped payloads, which live in dist/payload
          # and include a macOS `.zip` that would otherwise match.
          files=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          payloads=$(find dist/payload -maxdepth 1 -type f 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "no artifacts were built, so there is nothing to publish"
            exit 1
          fi
          echo "attaching:"; echo "$files"
          echo "payloads:"; echo "${payloads:-none}"

          cat > notes.md <<'NOTES'
          ## Download

          | | |
          |---|---|
          | **Windows** (64-bit) | [BrokkrSculpt-Windows-x86_64.zip](https://github.com/MakerViking/brokkrsculpt/releases/download/beta/BrokkrSculpt-Windows-x86_64.zip) |
          | **macOS** (Apple silicon) | [BrokkrSculpt-macOS-arm64.zip](https://github.com/MakerViking/brokkrsculpt/releases/download/beta/BrokkrSculpt-macOS-arm64.zip) |
          | **Linux** (64-bit) | [BrokkrSculpt-Linux-x86_64.tar.gz](https://github.com/MakerViking/brokkrsculpt/releases/download/beta/BrokkrSculpt-Linux-x86_64.tar.gz) |

          Those three links always point at the newest build. Everything in the
          asset list below named `update-…` is for the built-in updater to
          fetch; you never need to download one by hand.

          **An open beta, and unsigned.** Both matter to what you are about to see.

          ## The dialog your OS will show you

          Nothing here is signed by Apple or Microsoft, because those cost money
          this project does not have yet. Neither warning is about anything being
          wrong with the download.

          - **macOS** will say *"BrokkrSculpt.app is damaged and can't be opened."*
            It is not damaged; that is what Gatekeeper says about any unsigned app
            from the internet. Move it to Applications, then in Terminal run
            `xattr -dr com.apple.quarantine /Applications/BrokkrSculpt.app` and
            open it normally.

            Not Control+click then Open -- Sequoia removed that. The supported
            route is System Settings > Privacy & Security > **Open Anyway** after
            a failed launch, but it wants an admin password, only offers the
            button for about an hour afterwards, and an app with no signature at
            all may not appear there to be excused at all. The quarantine flag is
            the one path that does not depend on any of that, and it turns off
            nothing system wide.
          - **Windows** will show *"Windows protected your PC"* from SmartScreen.
            Click **More info**, then **Run anyway**.
          - **Linux** has nothing to say about it. Untar and run `./brokkrsculpt`.

          ## Known, and worth knowing before you file it

          - **macOS masking renders wrong.** A masked body's tint spreads past the
            mask and shows a seam between bricks. The geometry is correct and
            everything else works; this is a difference in how the Metal backend
            reads a vertex attribute and it is being chased. Linux and Windows are
            unaffected.
          - Windows and macOS have **no stylus pressure and no SpaceMouse**. Both
            are read straight from the Linux kernel today; the other two platforms
            fall back to full pressure and no puck.

          ## Updates

          This build can update itself. The tick is on the welcome screen and in
          the Help menu, on by default, and turning it off stops the check as
          well as the offer. Every update is signed and verified before anything
          is written.

          **The swap has only been run for real on Linux.** Windows and macOS
          share the same verified download and the same checks; what is untested
          there is the replacement itself. Both keep the previous build and leave
          a `RECOVER-BROKKRSCULPT.txt` beside the application saying how to
          restore it. `BROKKR_NO_SELF_UPDATE=1` downloads and verifies but never
          installs.

          ## Reporting

          Help > Report a bug sends straight from the app, anonymously unless you
          have signed in.
          NOTES
          # The changelog's own Unreleased section, so a user who downloads
          # twice can tell what changed. Section 1 is Unreleased; when it is
          # EMPTY -- which happens on the build carrying a release cut, since
          # the cut is its own commit -- fall back to section 2, the newest
          # named version. Without that fallback the cut would replace real
          # notes with none, on a tag that is rewritten every build.
          if [ -f CHANGELOG.md ]; then
            section() { awk -v want="$1" '/^## /{n++} n==want && !/^## /' CHANGELOG.md | sed -e '/./,$!d'; }
            section 1 > changes.md
            if [ ! -s changes.md ]; then
              echo "Unreleased is empty (a release was just cut) -- using the newest named section"
              section 2 > changes.md
            fi
            if [ -s changes.md ]; then
              printf '\n## What changed\n\n' >> notes.md
              cat changes.md >> notes.md
            fi
          else
            echo "WARNING: no CHANGELOG.md, publishing boilerplate notes only"
          fi

          printf '\n---\nBuilt from `%s`.\n' "$SHA" >> notes.md

          # **Updated in place, never deleted first.** Deleting the release and
          # recreating it leaves a window with no release at all, and since the
          # delete would come before the upload that window is however long the
          # assets take to push -- during which every download link 404s, and if
          # the create then fails the release is simply gone. That happened for
          # real on SindriCAD on 2026-08-05. A retry here repairs rather than
          # destroys.
          if gh release view beta --repo "$R" >/dev/null 2>&1; then
            gh release edit beta --repo "$R" --prerelease \
              --title "BrokkrSculpt open beta" --notes-file notes.md --target "$SHA"
          else
            gh release create beta --repo "$R" --prerelease \
              --title "BrokkrSculpt open beta" --notes-file notes.md --target "$SHA"
          fi

          # **One-time migration, 2026-08-31: drop the pre-rename human
          # archives BEFORE uploading the new ones.**
          #
          # They were `brokkrsculpt-<platform>.…` and are now
          # `BrokkrSculpt-<Platform>.…`. Two reasons this cannot wait until
          # after the upload, and the first is not optional:
          #
          # 1. **GitHub compares asset names case-insensitively.** Uploading
          #    `BrokkrSculpt-Windows-x86_64.zip` while `brokkrsculpt-windows-
          #    -x86_64.zip` exists fails with `HTTP 422 ReleaseAsset.name
          #    already exists`, and `--clobber` does not save it: that looks for
          #    an EXACT name to delete first, finds none, and uploads into the
          #    collision. Run 33359951784 failed exactly here.
          # 2. Left behind, the old names are orphaned -- nothing clobbers them
          #    any more, so they would sit in the release for ever frozen at
          #    whatever build was current when the rename landed. A download
          #    link that silently stops advancing is worse than one that 404s.
          #
          # The cost of deleting first is a gap of a few seconds with no human
          # archive attached, and if the upload below then fails, none until the
          # next push. That is the lesser risk: payloads and the manifest are
          # untouched, so self-updating keeps working throughout, and a failed
          # run is loud. Safe to delete this block once it has run.
          for stale in brokkrsculpt-linux-x86_64.tar.gz \
                       brokkrsculpt-windows-x86_64.zip \
                       brokkrsculpt-macos-arm64.zip; do
            if gh release delete-asset beta "$stale" --repo "$R" --yes 2>/dev/null; then
              echo "removed the pre-rename archive $stale"
            fi
          done

          # `--clobber` resets each asset's download count, which is the cost of a
          # rolling tag and is accepted: GitHub keeps no record of a replaced
          # asset, so lifetime totals are not recoverable either way.
          # shellcheck disable=SC2086
          gh release upload beta $files --repo "$R" --clobber

          # **Payloads are uploaded WITHOUT `--clobber`, deliberately.** Their
          # names carry the build ordinal, so a name collision means this run is
          # republishing an ordinal that already exists -- which is a bug worth
          # failing on, not something to overwrite. It is also what lets the
          # signed manifest name an immutable object: `latest.conf` is then the
          # only mutable thing in the release.
          if [ -n "$payloads" ]; then
            # shellcheck disable=SC2086
            gh release upload beta $payloads --repo "$R"
          fi

          # **Move the `beta` tag to the commit these assets were built from.**
          #
          # `gh release edit --target` updates the release RECORD and leaves the
          # tag object where it is, which is why the tag had been frozen at the
          # first publish while the assets were replaced on every push since --
          # measured 2026-08-30, the tag pointed at a commit that was not even an
          # ancestor of `main`. Anyone exercising their AGPL right to the
          # corresponding source got source that never built this binary.
          #
          # Patched through the API rather than `git push --force`, because the
          # build job now checks out with `persist-credentials: false` and this
          # job has `contents: write` on `GH_TOKEN` anyway. `force=true` because
          # a rolling tag moves backwards during a rollback.
          if gh api "repos/$R/git/ref/tags/beta" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$R/git/refs/tags/beta" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$R/git/refs" -f ref=refs/tags/beta -f sha="$SHA" >/dev/null
          fi
          echo "beta tag now at $SHA"


          # **Sweep old payloads, and never the one the live manifest names.**
          #
          # Retention is the only reason rollback is possible: mechanism 2 for
          # stopping a bad build is "publish seq+1 naming the last good build",
          # and that needs the last good build's payload to still be there.
          #
          # **Five sets, cut from twenty on 2026-08-31.** Twenty was sized as
          # though rollback were the normal repair, and it is not: pushing a fix
          # forward reaches everyone and needs no retention at all. Rollback is
          # only for "the new build is too broken to use and I cannot fix it
          # right now", and there you go back one build, not twenty. Five keeps
          # a full day of range at the measured cadence of four releases in an
          # afternoon, and the failure mode if it is ever not enough is not data
          # loss -- an older build can be rebuilt from its commit and published
          # under a new ordinal. What twenty cost was real: sixty payloads in
          # front of the three files a person came to download.
          #
          # The keep list is read back out of the PUBLISHED manifest rather than
          # computed here, so a sweep can never delete the payload the signed
          # manifest points at -- the one deletion that would break every
          # client at once. Signing is a LATER STEP of this same run, so at this
          # point `latest.conf` still names the PREVIOUS build; that is exactly
          # why it must be protected explicitly rather than assumed old.
          KEEP=5
          live_build=$(gh release download beta --repo "$R" --pattern latest.conf \
                         --output - 2>/dev/null | sed -n 's/^build *= *//p' | head -1 || true)
          echo "live manifest names build: ${live_build:-none}"

          # Every build-stamped payload, newest ordinal first. **Both spellings**
          # -- `update-<n>-…` is what this workflow publishes now, and
          # `brokkrsculpt-<n>-…` is what it published before 2026-08-31. Counting
          # only one of them would either retain the old ones for ever or sweep
          # the new ones on the wrong schedule.
          mapfile -t ordinals < <(
            gh release view beta --repo "$R" --json assets \
              --jq '.assets[].name' 2>/dev/null \
            | sed -nE 's/^(update|brokkrsculpt)-([0-9]+)-.*$/\2/p' | sort -rnu
          )
          echo "retained ordinals: ${ordinals[*]:-none}"

          dropped=0
          for i in "${!ordinals[@]}"; do
            [ "$i" -lt "$KEEP" ] && continue
            ordinal="${ordinals[$i]}"
            # Never the build the live manifest names, however old it is.
            if [ -n "$live_build" ] && [ "$ordinal" = "$live_build" ]; then
              echo "keeping $ordinal: the live manifest names it"
              continue
            fi
            # Both spellings again, for the same reason as the scan above. The
            # human archives are safe from this: they are `BrokkrSculpt-…`, and
            # neither prefix matches them at any case.
            for name in $(gh release view beta --repo "$R" --json assets \
                            --jq ".assets[].name | select(startswith(\"update-$ordinal-\") or startswith(\"brokkrsculpt-$ordinal-\"))"); do
              echo "sweeping $name"
              gh release delete-asset beta "$name" --repo "$R" --yes
              dropped=$((dropped + 1))
            done
          done
          # Said out loud rather than silently: a cap that quietly drops things
          # reads as "we kept everything" when someone later needs a rollback.
          echo "swept $dropped asset(s); keeping the newest $KEEP build(s)"

          # **Signing is the NEXT STEP of this run, not a human errand.** It
          # moved into CI on 2026-08-31. So at this point `latest.conf` still
          # names the previous build and that is normal -- what this report
          # catches is the signing step having failed or been skipped, whose
          # symptom is otherwise silence: clients keep being handed an older
          # manifest and nothing anywhere says why. Read the numbers below
          # against the "Sign the manifest" step that follows, not against a
          # command anyone is expected to run by hand.
          live_seq=$(gh release download beta --repo "$R" --pattern latest.conf \
                       --output - 2>/dev/null | sed -n 's/^seq *= *//p' | head -1 || true)
          if [ -z "${live_build:-}" ]; then
            echo "::warning::no signed manifest is published yet, so no client will see build ${BROKKR_BUILD} unless the signing step below succeeds."
          elif [ "${live_build}" != "${BROKKR_BUILD}" ]; then
            behind=$(( BROKKR_BUILD - live_build ))
            if [ "$behind" -gt 1 ]; then
              echo "::warning::the signed manifest still names build ${live_build} (seq ${live_seq:-?}) while ${BROKKR_BUILD} is published -- ${behind} builds behind, so signing has been failing. Check the step below."
            else
              echo "the signed manifest names build ${live_build}; the signing step below should take it to ${BROKKR_BUILD}"
            fi
          fi

      # **Signed here, after the payloads are uploaded**, because the signer
      # reads them back off the release and hashes what is actually published
      # rather than what this job happened to build. Ordering matters: run this
      # before `Publish` and there is nothing to hash.
      - name: Sign the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          # Guarded in bash rather than in a step `if:`, because the `secrets`
          # context is NOT available there -- and a workflow expression that is
          # not allowed where it sits fails the whole file to compile, with no
          # jobs and a run reported against the file path. That already happened
          # once in this file, with arithmetic in workflow-level `env`.
          #
          # Skipped rather than failed when the key is absent, so a fork or a
          # repo before the secret is configured still publishes. The check at
          # the end of `Publish` then reports the manifest as behind, which is
          # the honest signal -- a signing step that silently does nothing is
          # how a release channel stops working with nobody noticing.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::no MINISIGN_SECRET_KEY configured, so build ${BROKKR_BUILD} was published but NOT signed. No client will be offered it."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

          # Written 0600 and shredded on the way out whatever happens. It never
          # reaches a log: written from the environment, never echoed, and no
          # `set -x` anywhere in this file.
          key=$(mktemp)
          chmod 600 "$key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"

          # **Epoch 0 only, and that is the whole reason this is survivable.**
          # The standby at epoch 1 is deliberately NOT here: it is the recovery
          # path, and a recovery path kept beside the thing it recovers from is
          # not one. If this runner is ever compromised, epoch 1 signs from
          # Thomas's own backups and every client that takes that build refuses
          # epoch 0 for ever after.
          #
          # What CI signing gives up, said once so it is not rediscovered: the
          # local script downloads and hashes payloads so a compromised runner
          # cannot get a backdoored build signed. Here the runner IS the signer,
          # so that protection is gone and provenance attestation plus the epoch
          # rotation are what remain.
          BROKKR_RELEASE_REPO="$R" ./scripts/sign-release.sh \
            "${BROKKR_BUILD:?}" \
            --requires-reinstall 0 \
            --key-epoch 0 \
            --secret-key "$key" \
            --yes
