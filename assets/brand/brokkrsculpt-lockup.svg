<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BrokkrSCULPT">
  <defs>
    <!-- The same molten gradient SindriCAD's mark is drawn in: the two are
         forged by the two brothers and should read as a pair. -->
    <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33517A"/>
      <stop offset="0.30" stop-color="#FF7C36"/>
      <stop offset="1" stop-color="#DE3A16"/>
    </linearGradient>
  </defs>

  <!-- Mark: a chisel biting into a block, with two voxels coming off it.
       SindriCAD's mark is a spline showing its control points, because that is
       what its document IS. This is the verb rather than the noun: a cube
       alone says CAD as readily as it says sculpting. Geometry is shared
       verbatim with brokkrsculpt-mark.svg and brokkr-app/src/logo.rs. -->
  <g transform="translate(-4,32) scale(0.58)">
    <path d="M40 128 L96 96 L152 128 L152 188 L96 220 L40 188 Z" fill="url(#molten)"/>
    <path d="M96 96 L152 128 L96 160 L40 128 Z" fill="#FFFFFF" opacity="0.14"/>
    <path d="M152 128 L152 188 L96 220 L96 160 Z" fill="#000000" opacity="0.22"/>
    <path d="M40 128 L96 96 L152 128 L152 188 L96 220 L40 188 Z M96 160 L40 128 M96 160 L152 128 M96 160 L96 220"
          fill="none" stroke="#16283D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
    <path d="M70.9 38.5 L99.2 16.4 L116.5 38.5 L88.1 60.6 Z" fill="#6B4F35"/>
    <path d="M89.6 54.4 L110.1 38.4 L155.6 96.7 L135.1 112.7 Z" fill="#B9C4D2"/>
    <path d="M89.6 54.4 L97.4 48.2 L143.0 106.5 L135.1 112.7 Z" fill="#E8EEF6"/>
    <path d="M135.1 112.7 L155.6 96.7 L160.1 123.6 Z" fill="#8496AA"/>
    <rect x="176" y="150" width="15" height="15" rx="2.5" fill="#FFFFFF" stroke="#FF5A2C" stroke-width="3" transform="rotate(16 183.5 157.5)"/>
    <rect x="200" y="182" width="11" height="11" rx="2" fill="#FFFFFF" stroke="#FF5A2C" stroke-width="2.5" opacity="0.8" transform="rotate(-20 205.5 187.5)"/>
  </g>

  <!-- wordmark: convert to outlines before shipping so it renders identically everywhere -->
  <text x="176" y="112" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#16283D">Brokkr</tspan><tspan fill="#FF5A2C">SCULPT</tspan>
  </text>
  <text x="178" y="146" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#5B6E82">Voxel sculpting, forged for the print.</text>
</svg>
