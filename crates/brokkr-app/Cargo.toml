# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "brokkr-app"
description = "BrokkrSculpt: a voxel and SDF based 3D sculpting application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "brokkrsculpt"
path = "src/main.rs"

[dependencies]
brokkr-core.workspace = true
brokkr-gpu.workspace = true
bytemuck.workspace = true
env_logger.workspace = true
glam.workspace = true
iced = { workspace = true, features = ["advanced", "wgpu", "debug"] }
log.workspace = true
rfd.workspace = true
wgpu.workspace = true

# Stylus pressure is read straight from the kernel's evdev interface. That sits
# below the display server, so one code path covers X11, XWayland and Wayland,
# and it works with any tablet the kernel has a driver for rather than a list of
# vendors. Nothing else in the stack can supply it: iced 0.14 drops winit's
# force field, and winit 0.30 only ever had it for touch.
[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
