# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "brokkr-app"
description = "BrokkrSculpt: a voxel and SDF based 3D sculpting application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "brokkrsculpt"
path = "src/main.rs"

[dependencies]
brokkr-core.workspace = true
brokkr-gpu.workspace = true
bytemuck.workspace = true
env_logger.workspace = true
glam.workspace = true
# `canvas` is the icon set, and it is the one feature of iced this project pays
# for. Measured against this lockfile: canvas adds SIX crates -- the `lyon`
# tessellator and `float_next_after` -- where `svg` adds THIRTY ONE (resvg,
# usvg, rustybuzz, and four raster decoders for bitmaps an icon never carries)
# and `image` adds seventy one. `logo.rs` predicted this trade in its own header
# and drew the mark out of `fill_quad` rectangles rather than take it early;
# fill_quad is axis-aligned rectangles only, which a 24px stroke icon with
# circles and diagonals cannot be made of. A whole icon set is what earns the
# six. See `icon.rs`.
iced = { workspace = true, features = ["advanced", "wgpu", "debug", "canvas", "image-without-codecs"] }
# The welcome screen's article thumbnails. `default-features = false` is the
# whole point: iced's own `image` feature is `image-without-codecs` PLUS
# `image/default`, and it is the second half that brings AVIF, EXR, AV1 grain
# synthesis and fax decoding -- measured against this lockfile, +72 crates.
# The widget alone is +6 and these two decoders are +9. Both are needed: the
# feed carries JPEG and PNG, and the render endpoint keeps a PNG a PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log.workspace = true
# The updater's signature check, and the only new crate the updater costs.
# ZERO transitive dependencies -- Ed25519 and Blake2b are implemented inline in
# about 2.5k lines, MIT. Version pinned exactly rather than caret-bounded:
# cargo has no release-age gate the way npm and bun do on this machine, so the
# lockfile diff for this one gets read by hand.
#
# `ed25519-dalek` was the alternative and is rejected: it gives a bare
# primitive, so the container format, the key-id check and the prehash would
# all have to be reinvented here, badly, in the one code path whose output gets
# made executable.
minisign-verify = "=0.2.5"
rfd.workspace = true
# SHA-256 for the update payload. **+0 compiled crates**: `ring 0.17.14` is
# already in the graph as rustls' backend (Cargo.lock:3040), so this is a
# declaration rather than a dependency -- but it IS a new direct line, because
# being in the lockfile does not let you `use` it.
#
# Hand-rolling SHA-256 here is forbidden. This tree has form for hand-rolling
# (FNV-1a in `report.rs`, the 3MF ZIP writer, the IOKit externs) and this is the
# single worst place in the codebase to be clever: it is the check that decides
# whether network bytes get the execute bit.
ring = "0.17"
serde_json = "1.0.151"
# The bug report's one and only network call. `default-features = false` with
# just `rustls` is what keeps this to a measured 17 compiled crates for this
# target: no proxy support, no cookies, no charset transcoding, no gzip, and
# rustls with its bundled webpki-roots rather than a platform verifier, so
# there is no system OpenSSL to link and the trust store is reproducible.
#
# The `~3.3` bound is a COOLDOWN, not a compatibility limit. Cargo has no
# release-age gate the way npm and bun do here, so publish dates are checked by
# hand -- and 3.4.0 was ten days old when this went in, against the 216 days
# rfd had. It costs one crate to stay on 3.3 (ureq-proto 3.3 pulls base64 0.22
# alongside the 0.23 already in the graph); an extra leaf crate is a cheaper
# risk than a fortnight-old release of the code that terminates our TLS.
# Lift the bound to "3" once 3.4.x has aged.
ureq = { version = "~3.3", default-features = false, features = ["rustls"] }
# +0 crates: already compiled for brokkr-core's 3MF importer. See articles.rs
# for why the welcome screen reads RSS rather than the JSON API.
getrandom.workspace = true
roxmltree.workspace = true
wgpu.workspace = true

# Stylus pressure is read straight from the kernel's evdev interface. That sits
# below the display server, so one code path covers X11, XWayland and Wayland,
# and it works with any tablet the kernel has a driver for rather than a list of
# vendors. Nothing else in the stack can supply it: iced 0.14 drops winit's
# force field, and winit 0.30 only ever had it for touch.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true

# Blocks on wgpu's adapter and device futures, and nothing else. Needed because
# `SharedFrame::apply` orders a pool reset, a set of body deletions and a batch
# of uploads against each other, and getting that order wrong draws a deleted
# body forever with no counter moving -- so the test builds a real
# `SculptRenderer` rather than asserting against a stand-in that could agree
# with a wrong ordering. Costs zero new crates: `pollster` is already a
# workspace dependency and already compiled for `brokkr-gpu`'s own tests.
[dev-dependencies]
pollster.workspace = true

# `poke` is nothing but evdev: it writes synthetic pointer and key events to
# `/dev/uinput`. Opt-in rather than a `cfg` on each of its ten items, which
# would be ten attributes saying the same thing, and rather than a bare
# `cfg(target_os)` on the file, which cannot work because an example still
# needs a `main` on the platforms it is switched off for. Build it with
# `--features uinput`; `scripts/drive.py` is what drives the window day to day.
[features]
uinput = []

[[example]]
name = "poke"
required-features = ["uinput"]
