# Pinned so the lint set is deterministic.
#
# CI runs with `RUSTFLAGS: -D warnings`, so without a pin it floats on whatever
# stable the runner image happens to carry, and every new warn-by-default clippy
# lint turns the build red with no code change — on a contributor's PR, usually.
# That is exactly what happened on 2026-08-26: `chunks_exact_to_as_chunks`
# landed in 1.98 and failed a build that was clean on the maintainer's 1.95.
#
# Bump this deliberately, and fix the new lints in the same commit.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
