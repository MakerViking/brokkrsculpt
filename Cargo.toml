[workspace]
resolver = "3"
members = ["crates/brokkr-core", "crates/brokkr-gpu", "crates/brokkr-app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MakerViking/brokkrsculpt"
rust-version = "1.90"

[workspace.dependencies]
brokkr-core = { path = "crates/brokkr-core" }
brokkr-gpu = { path = "crates/brokkr-gpu" }

bytemuck = { version = "1", features = ["derive"] }
fast-surface-nets = "0.2"
glam = { version = "0.33", features = ["bytemuck"] }
iced = "0.14"
iced_wgpu = "0.14"
log = "0.4"
env_logger = "0.11"
evdev = "0.13"
# Native file dialogs. On Linux this is the XDG desktop portal, which is what a
# sandboxed app needs anyway. Its entire dependency set was already in this
# lockfile before it was added -- see the note in brokkr-app/Cargo.toml.
rfd = "0.17"
pollster = "0.4"
rayon = "1"
# XML and raw DEFLATE, both needed to read a 3MF and both already compiled for
# this workspace before they were named here: roxmltree arrives through
# fontconfig-parser -> fontdb -> cosmic-text, and yazi through swash ->
# cosmic-text, so making them direct dependencies of brokkr-core costs zero new
# crates. Each has no dependencies of its own, so the worst case if Iced ever
# changes its text stack is that we compile two small leaf crates ourselves.
# Pinned to 0.20 rather than 0.21 because 0.21 is both a new compile and yanked.
roxmltree = "0.20"
rustc-hash = "2"
yazi = "0.2.1"
# Pinned to 27 because iced_wgpu 0.14 depends on wgpu ^27. The shader widget
# hands us a real wgpu::Device and RenderPass, so a different major version
# here would be a different, incompatible type. Bump both together or not at
# all.
wgpu = "27"

# Debug builds of a wgpu application are unusably slow without this. Our own
# crates keep opt-level 1 so backtraces stay readable, dependencies get full
# optimisation because we are not debugging them.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
debug = true
